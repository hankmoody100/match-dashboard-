name: Daten aktualisieren

on:
  schedule:
    - cron: "*/20 * * * *"   # alle 20 Minuten (GitHub startet manchmal einige Minuten später)
  workflow_dispatch:          # manuell über "Run workflow"
  push:
    branches: [main]          # neue index.html sofort online bringen

permissions:
  contents: write

concurrency:
  group: tendenz-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Letzten Datenstand holen
        run: |
          mkdir -p site/data
          if git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
            git archive origin/gh-pages data | tar -x -C site || true
          elif [ -d data ]; then
            cp -r data/. site/data/ || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/update-data.yml

      - run: pip install pandas requests openpyxl

      - name: Daten abrufen
        env:
          DATA_DIR: site/data
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional, für kommende Tennis-Matches
        run: python scripts/fetch_football.py

      - name: Seite veröffentlichen (Zweig gh-pages, ohne Verlauf)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp index.html site/
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Stand $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
